name: Build extractor

on:
  push:
    branches: [main]
    paths:
      - 'extractor.js'
      - '.github/workflows/build-extractor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-extractor
  cancel-in-progress: true

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check extractor.js

      - name: Minify -> extractor.min.js
        run: |
          npx --yes terser@5.36.0 extractor.js \
            --compress passes=3,drop_debugger=true \
            --mangle \
            --format "comments=false,preamble='/*! Game Extractor — built from extractor.js — MIT */'" \
            --output extractor.min.js
          node --check extractor.min.js

      - name: Verify the bundle still boots
        run: |
          node -e "
            const s = require('fs').readFileSync('extractor.min.js','utf8');
            if (!s.includes('__gex')) { console.error('missing __gex entrypoint'); process.exit(1); }
            if (s.length < 5000) { console.error('suspiciously small'); process.exit(1); }
            console.log('ok -', s.length, 'bytes');
          "

      - name: Write build info
        run: |
          RAW=$(wc -c < extractor.js)
          MIN=$(wc -c < extractor.min.js)
          GZ=$(gzip -c extractor.min.js | wc -c)
          printf '{\n  "version": "%s",\n  "builtAt": "%s",\n  "commit": "%s",\n  "bytes": { "raw": %s, "min": %s, "gzip": %s }\n}\n' \
            "$(grep -o "VERSION = '[^']*'" extractor.js | head -1 | cut -d"'" -f2)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$RAW" "$MIN" "$GZ" > build-info.json
          cat build-info.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extractor.min.js build-info.json
          git diff --staged --quiet || git commit -m "build: refresh extractor.min.js [skip ci]"
          git push

      - name: Summary
        run: |
          echo "### Game Extractor built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat build-info.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
